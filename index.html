<!DOCTYPE html>
<html>
<head>
    <title>ASCII Desktop System</title>
    <meta charset="UTF-8">
    <style>
      body, html {
          margin: 0;
          padding: 0;
          height: 100%;
          overflow: hidden;
      }
      #characters-grid {
          width: 100%;
          height: 100%;
          background-color: white;
          overflow: hidden;
          font-family: monospace;
          white-space: pre;
          line-height: 1; /* Consistent line height */
          font-size: 14px;
          cursor: default;
          user-select: none;
          -webkit-user-select: none;
          -moz-user-select: none;
          -ms-user-select: none;
      }
      .resize-handle {
          color: red;
          display: inline-block;
          width: 1ch;
          text-align: center;
      }
      /* Base Cursor Style (Solid) */
      .cursor {
        background-color: black;
        color: white;
        min-width: 1ch;
        outline: 1px dotted rgba(0,0,0,0.3);
        box-sizing: border-box;
      }
      /* Blinking Animation */
      @keyframes blink {
        50% {
          background-color: transparent;
          color: initial;
          outline-color: transparent;
        }
      }
      /* Class to apply blinking */
      .cursor-blink {
        animation: blink 1s step-start infinite;
      }
      /* Style for Close Button */
      .close-button {
          color: red;
          font-weight: bold;
      }
    </style>
</head>

<body>
    <div id="characters-grid"></div>

    <script>
      // --- START OF EDITOR LOGIC ---

      /**
       * Represents the text buffer holding the editor's content.
       */
      class EditorBuffer {
          constructor(lines) {
              this.lines = lines || [""];
              this.lines = this.lines.map(line => String(line));
          }

          get length() {
              return this.lines.length;
          }

          get bottom() {
              return Math.max(0, this.lines.length - 1);
          }

          getLine(index) {
              return this.lines[index] || "";
          }

          insert(cursor, string) {
              const row = cursor.row;
              const col = cursor.col;
              while (row >= this.lines.length) {
                  this.lines.push("");
              }
              let current = this.lines[row];
              const safeCol = clamp(col, 0, current.length);
              const newLine = current.slice(0, safeCol) + string + current.slice(safeCol);
              this.lines[row] = newLine;
          }

          split(cursor) {
              const row = cursor.row;
              const col = cursor.col;
              if (row >= this.lines.length) {
                  this.lines.push("");
                  return;
              }
              let current = this.lines[row];
              const safeCol = clamp(col, 0, current.length);
              const before = current.slice(0, safeCol);
              const after = current.slice(safeCol);
              this.lines[row] = before;
              this.lines.splice(row + 1, 0, after);
          }

          delete(cursor) {
              const row = cursor.row;
              const col = cursor.col;
              if (row > this.bottom || (row === this.bottom && col >= this.getLine(row).length)) {
                  return;
              }
              let current = this.lines[row];
              if (col < current.length) {
                  const newLine = current.slice(0, col) + current.slice(col + 1);
                  this.lines[row] = newLine;
              } else if (row < this.bottom) {
                  const nextLine = this.lines.splice(row + 1, 1)[0];
                  this.lines[row] = current + nextLine;
              }
          }

          get maxLineLength() {
              return this.lines.reduce((max, line) => Math.max(max, line.length), 0);
          }
      }

      function clamp(x, lower, upper) {
          if (x < lower) return lower;
          if (x > upper) return upper;
          return x;
      }

      class EditorCursor {
          constructor(row = 0, col = 0, col_hint = null) {
              this._row = row;
              this._col = col;
              this._col_hint = col_hint === null ? col : col_hint;
          }
          // Row position getter/setter
          get row() { 
              return this._row; 
          }
          set row(newRow) { 
              this._row = newRow; 
          }

          // Column position getter/setter 
          get col() { 
              return this._col; 
          }
          set col(newCol) { 
              this._col = newCol;
              this._col_hint = newCol;
          }

          // Clamp column position based on line length
          _clamp_col(buffer) {
              const lineLength = buffer.getLine(this.row).length;
              this._col = clamp(this._col_hint, 0, lineLength);
          }

          // Move cursor up one row if possible
          up(buffer) {
              if (this.row > 0) {
                  this.row -= 1;
                  this._clamp_col(buffer);
              }
          }

          // Move cursor down one row if possible
          down(buffer) {
              if (this.row < buffer.length) {
                  this.row += 1;
                  if (this.row > buffer.bottom) {
                      this.row = buffer.bottom;
                  }
                  this._clamp_col(buffer);
              }
          }

          // Move cursor left one column, or to end of previous line
          left(buffer) {
              if (this.col > 0) {
                  this.col -= 1;
              } else if (this.row > 0) {
                  this.row -= 1;
                  this.col = buffer.getLine(this.row).length;
              }
          }

          // Move cursor right one column, or to start of next line  
          right(buffer) {
              const currentLineLength = buffer.getLine(this.row).length;
              if (this.col < currentLineLength) {
                  this.col += 1;
              } else if (this.row < buffer.bottom) {
                  this.row += 1;
                  this.col = 0;
              }
          }
      }

      class EditorWindow {
          // Initialize editor window with dimensions and position
          constructor(rows, cols, startRow = 0, startCol = 0) {
              this.n_rows = rows;     // Number of rows in the window
              this.n_cols = cols;     // Number of columns in the window
              this.row = startRow;    // Starting row position (scroll offset)
              this.col = startCol;    // Starting column position (scroll offset)
          }

          // Get the bottom-most row number of the window
          get bottom() {
              return this.row + this.n_rows - 1;
          }

          // Scroll window up if cursor moves above window
          up(cursor) {
              if (cursor.row < this.row) {
                  this.row = cursor.row;
              }
          }

          // Scroll window down if cursor moves below window
          down(buffer, cursor) {
              if (cursor.row > this.bottom) {
                  this.row = cursor.row - this.n_rows + 1;
              }
          }

          // Handle horizontal scrolling to keep cursor in view
          horizontal_scroll(cursor, leftMargin = 5, rightMargin = 2) {
              const windowWidth = this.n_cols;
              if (cursor.col < this.col + leftMargin) {
                  this.col = Math.max(0, cursor.col - leftMargin);
              } else if (cursor.col >= this.col + windowWidth - rightMargin) {
                  this.col = cursor.col - windowWidth + rightMargin + 1;
              }
              this.col = Math.max(0, this.col);
          }

          // Convert cursor position to coordinates relative to window
          translate(cursor) {
              return {
                  rel_row: cursor.row - this.row,  // Row position relative to window
                  rel_col: cursor.col - this.col   // Column position relative to window
              };
          }
      }

      // Move cursor left and adjust window scroll position
      function editorLeft(editorWindow, textBuffer, editorCursor) {
          editorCursor.left(textBuffer);
          editorWindow.up(editorCursor);
          editorWindow.horizontal_scroll(editorCursor);
      }

      // Move cursor right and adjust window scroll position 
      function editorRight(editorWindow, textBuffer, editorCursor) {
          editorCursor.right(textBuffer);
          editorWindow.down(textBuffer, editorCursor);
          editorWindow.horizontal_scroll(editorCursor);
      }
      // --- END OF EDITOR LOGIC ---


      // --- START OF ASCII DESKTOP SYSTEM (v16 - Final Touches) ---
      const CURSOR_BLINK_DELAY = 800;

      /**
       * Base class for all ASCII widgets.
       */
      class TWidget {
          constructor(x, y, w, h, title) {
              // Note: We're keeping short property names (x, y, w, h) because they're used
              // extensively throughout the codebase as standard coordinates terminology
              this.x = x; this.y = y; this.w = w; this.h = h;
              this.title = title;
              this.hasFocus = false;
          }

          destroy() {
              // Find and remove this widget from the global tWidgets array
              const i = tWidgets.indexOf(this);
              if (i > -1) {
                  tWidgets.splice(i, 1);
              }

              // Clear active widget reference if it was this widget
              if (activeWidget === this) {
                  activeWidget = null;
              }
          }

          // Set focus state to true when widget gains focus
          gainFocus() {
              this.hasFocus = true;
          }

          // Set focus state to false when widget loses focus  
          loseFocus() {
              this.hasFocus = false;
          }

          // Handle keyboard events, returns false by default
          handleKeyPress(e) {
              return false;
          }

          // Handle scroll events, returns false by default
          scroll(scrollDelta) {
              return false;
          }

          // Handle click events at coordinates (x,y)
          click(x, y) {
              // Default empty implementation
          }

          clearContents(charGrid) {
              const contentWidth = this.w - 2;
              const contentHeight = this.h - 2;
              for (let rowIndex = this.y + 1; rowIndex < this.y + 1 + contentHeight; rowIndex++) {
                  for (let colIndex = this.x + 1; colIndex < this.x + 1 + contentWidth; colIndex++) {
                      if (rowIndex < GRID_HEIGHT_chars && colIndex < GRID_WIDTH_chars) {
                          setChar(charGrid, colIndex, rowIndex, ' ');
                      }
                  }
              }
          }

          // Draw the bottom border of the widget using '─' characters
          draw_bottomBorder(charGrid) {
              for (let colIndex = this.x; colIndex < this.x + this.w; colIndex++) {
                  setChar(charGrid, colIndex, this.y + this.h - 1, '─');
              }
          }

          // Draw the top border of the widget using '─' characters
          draw_topBorder(charGrid) {
              for (let colIndex = this.x; colIndex < this.x + this.w; colIndex++) {
                  setChar(charGrid, colIndex, this.y, '─');
              }
          }

          // Draw the left border of the widget using '│' characters
          draw_leftBorder(charGrid) {
              for (let rowIndex = this.y + 1; rowIndex < this.y + this.h - 1; rowIndex++) {
                  setChar(charGrid, this.x, rowIndex, '│');
              }
          }

          // Draw the right border of the widget using '│' characters
          draw_rightBorder(charGrid) {
              for (let rowIndex = this.y + 1; rowIndex < this.y + this.h - 1; rowIndex++) {
                  setChar(charGrid, this.x + this.w - 1, rowIndex, '│');
              }
          }

          // Draw the corner characters ('┌', '┐', '└') of the widget
          draw_corners(charGrid) {
              setChar(charGrid, this.x, this.y, '┌');
              setChar(charGrid, this.x + this.w - 1, this.y, '┐');
              setChar(charGrid, this.x, this.y + this.h - 1, '└');
          }

          // Draw the widget title, truncating if it exceeds available space
          draw_title(charGrid) {
              const maxTitleLen = this.w - 4;
              const titleStr = this.title.substring(0, Math.max(0, maxTitleLen));
              for (let charIndex = 0; charIndex < titleStr.length; charIndex++) {
                  setChar(charGrid, this.x + 1 + charIndex, this.y, titleStr[charIndex]);
              }
          }

          // Draw the close button ('X') if widget is wide enough
          draw_close_button(charGrid) {
              if (this.w >= 4) {
                  setChar(charGrid, this.x + this.w - 2, this.y, 'X');
              }
          }

          // Draw the resize handle ('◢') in bottom-right corner if widget has positive dimensions
          draw_resizerHandle(charGrid) {
              if (this.w > 0 && this.h > 0) {
                  setChar(charGrid, this.x + this.w - 1, this.y + this.h - 1, '◢');
              }
          }

          // Placeholder for widget-specific content drawing
          draw_content(charGrid) { } // Overridden by subclasses

          draw(charGrid, isTopWidget = false) {
              this.draw_shadow(charGrid, isTopWidget);
              // Draw the horizontal borders (top and bottom)
              this.draw_topBorder(charGrid);
              this.draw_bottomBorder(charGrid);
              
              // Draw the vertical borders (left and right) 
              this.draw_leftBorder(charGrid);
              this.draw_rightBorder(charGrid);
              this.draw_corners(charGrid);
              this.draw_title(charGrid);
              this.draw_close_button(charGrid);
              this.draw_resizerHandle(charGrid);
              this.clearContents(charGrid);
              this.draw_content(charGrid);
          }

          // Draw a shadow effect for the widget using shading characters
          draw_shadow(charGrid, isTopWidget) {
              // Choose shadow intensity based on whether widget is on top
              const shadowChar = isTopWidget ? MEDIUM_SHADE : LIGHT_SHADE;
              
              // Draw bottom shadow if within grid bounds
              const bottomEdgeY = this.y + this.h;
              if (bottomEdgeY < GRID_HEIGHT_chars) {
                  for (let colIndex = this.x + 1; colIndex < this.x + this.w + 1 && colIndex < GRID_WIDTH_chars; colIndex++) {
                      setChar(charGrid, colIndex, bottomEdgeY, shadowChar);
                  }
              }
              
              // Draw right shadow if within grid bounds
              const rightEdgeX = this.x + this.w;
              if (rightEdgeX < GRID_WIDTH_chars) {
                  for (let rowIndex = this.y + 1; rowIndex < this.y + this.h && rowIndex < GRID_HEIGHT_chars; rowIndex++) {
                      setChar(charGrid, rightEdgeX, rowIndex, shadowChar);
                  }
              }
          }

          // Update widget dimensions
          updateDimensions(newWidth, newHeight) {
              this.w = newWidth;
              this.h = newHeight;
          }

          // Scrollbar information methods - defaults to no scrollbars
          getVerticalScrollbarInfo() {
              return null; // Default: no scrollbar
          }

          getHorizontalScrollbarInfo() {
              return null; // Default: no scrollbar
          }

          // Update scroll position - default implementation does nothing
          updateScrollOffset(axis, newOffset) {
              return false; // Default: no change
          }
      }

      // --- TEditorWidget ---
      class TEditorWidget extends TWidget {
          constructor(posX, posY, width, height, title, initialText = "") {
              super(posX, posY, width, height, title);
              this.buffer = new EditorBuffer(initialText.split('\n'));
              this.cursor = new EditorCursor();
              const contentWidth = Math.max(1, this.w - 3);
              const contentHeight = Math.max(1, this.h - 3);
              this.editorWindow = new EditorWindow(contentHeight, contentWidth);
              this.cursorScreenPos = { x: -1, y: -1 };
              this.isCursorBlinking = false; 
              this.cursorBlinkTimer = null;
          }

          // Handle gaining focus - reset cursor blinking state and start blink timer
          gainFocus() {
              super.gainFocus();
              this.isCursorBlinking = false;
              this.resetCursorBlinkTimer();
          }

          // Handle losing focus - clean up cursor blinking timer and state
          loseFocus() {
              super.loseFocus();
              clearTimeout(this.cursorBlinkTimer);
              this.cursorBlinkTimer = null;
              this.isCursorBlinking = false;
          }

          // Reset the cursor blink timer and handle redraw logic
          resetCursorBlinkTimer() {
              // Clear any existing blink timer
              clearTimeout(this.cursorBlinkTimer);
              this.cursorBlinkTimer = null;

              // Check if we need to redraw based on previous blink state
              const needsRedraw = this.isCursorBlinking;
              this.isCursorBlinking = false;

              // Redraw if needed and has focus
              if (needsRedraw && this.hasFocus) {
                  drawTWidgets();
              }

              // Start new blink timer if focused
              if (this.hasFocus) {
                  this.cursorBlinkTimer = setTimeout(() => {
                      this.isCursorBlinking = true;
                      this.cursorBlinkTimer = null;
                      
                      // Only redraw if focused and cursor is visible
                      if (this.hasFocus && this.cursorScreenPos.x !== -1) {
                          drawTWidgets();
                      }
                  }, CURSOR_BLINK_DELAY);
              }
          }

          // Update dimensions of editor window and adjust cursor/scroll position
          updateDimensions(w, h) {
              super.updateDimensions(w, h);
              // Calculate content dimensions accounting for borders
              const cW = Math.max(1, this.w - 3);
              const cH = Math.max(1, this.h - 3);
              
              // Update editor window dimensions
              this.editorWindow.n_rows = cH;
              this.editorWindow.n_cols = cW;
              
              // Ensure cursor stays within valid bounds
              this.cursor.row = clamp(this.cursor.row, 0, this.buffer.bottom);
              this.cursor._clamp_col(this.buffer);
              
              // Adjust scroll position based on cursor
              this.editorWindow.down(this.buffer, this.cursor);
              this.editorWindow.horizontal_scroll(this.cursor);
          }

          // Clear the content area of the editor window
          clearContents(a) {
              const d = this._getContentDimensions();
              for (let j = this.y + 1; j < this.y + 1 + d.contentHeight; j++) {
                  for (let i = this.x + 1; i < this.x + 1 + d.contentWidth; i++) {
                      if (j < GRID_HEIGHT_chars && i < GRID_WIDTH_chars) {
                          setChar(a, i, j, ' ');
                      }
                  }
              }
          }

          // Calculate dimensions of editor content area and determine if scrollbars are needed
          _getContentDimensions() {
              // Calculate maximum height and width without borders
              const maxHeight = Math.max(0, this.h - 2);
              const maxWidth = Math.max(0, this.w - 2);

              // Check if vertical scrollbar might be needed initially
              const verticalPossiblyNeeded = this.buffer.length > maxHeight && 
                                           maxWidth > 0 && 
                                           maxHeight > 0;

              // Check if horizontal scrollbar might be needed initially  
              const horizontalPossiblyNeeded = this.buffer.maxLineLength > maxWidth && 
                                             maxWidth > 0 && 
                                             maxHeight > 0;

              // Adjust height for horizontal scrollbar if needed
              const heightForVertical = maxHeight - (horizontalPossiblyNeeded ? 1 : 0);

              // Final check if vertical scrollbar is needed with adjusted height
              const verticalNeeded = this.buffer.length > heightForVertical && 
                                   maxWidth > 0 && 
                                   heightForVertical > 0;

              // Adjust width for vertical scrollbar if needed
              const widthForHorizontal = maxWidth - (verticalPossiblyNeeded ? 1 : 0);

              // Final check if horizontal scrollbar is needed with adjusted width
              const horizontalNeeded = this.buffer.maxLineLength > widthForHorizontal && 
                                     widthForHorizontal > 0 && 
                                     maxHeight > 0;

              // Calculate scrollbar dimensions
              const verticalScrollWidth = verticalNeeded ? 1 : 0;
              const horizontalScrollHeight = horizontalNeeded ? 1 : 0;

              // Calculate final content dimensions accounting for scrollbars
              const contentWidth = Math.max(0, this.w - 2 - verticalScrollWidth);
              const contentHeight = Math.max(0, this.h - 2 - horizontalScrollHeight);

              return {
                  vScrollNeeded: verticalNeeded,
                  hScrollNeeded: horizontalNeeded, 
                  contentWidth: contentWidth,
                  contentHeight: contentHeight
              };
          }

          draw_content(a) {
              // Get references to commonly used objects
              const win = this.editorWindow;
              const buf = this.buffer;
              const dims = this._getContentDimensions();

              // Set window dimensions
              win.n_rows = dims.contentHeight;
              win.n_cols = dims.contentWidth;

              // Draw editor content if there is space
              if (dims.contentWidth > 0 && dims.contentHeight > 0) {
                  for (let rr = 0; rr < dims.contentHeight; rr++) {
                      // Get line content, handling out of bounds
                      const br = win.row + rr;
                      let l = (br >= 0 && br < buf.length) ? buf.getLine(br) : "";

                      // Apply horizontal scroll and width limits
                      l = l.substring(win.col);
                      if (l.length > dims.contentWidth) {
                          l = l.substring(0, dims.contentWidth);
                      }

                      // Draw line characters
                      const sy = this.y + 1 + rr;
                      for (let rc = 0; rc < dims.contentWidth; rc++) {
                          const sx = this.x + 1 + rc;
                          const ch = rc < l.length ? l[rc] : ' ';
                          setChar(a, sx, sy, ch);
                      }
                  }
              }

              // Draw vertical scrollbar if needed
              if (dims.vScrollNeeded) {
                  const scrollInfo = this.getVerticalScrollbarInfo();
                  if (scrollInfo) {
                      // Draw vertical track and thumb
                      for (let pos = 0; pos < scrollInfo.trackSize; pos++) {
                          const isThumb = (pos >= scrollInfo.thumbPosition && 
                                         pos < scrollInfo.thumbPosition + scrollInfo.thumbSize);
                          const char = isThumb ? '#' : '│';
                          setChar(a, this.x + this.w - 2, this.y + 1 + pos, char);
                      }
                  }
              }

              // Draw horizontal scrollbar if needed  
              if (dims.hScrollNeeded) {
                  const scrollInfo = this.getHorizontalScrollbarInfo();
                  if (scrollInfo) {
                      // Draw horizontal track and thumb
                      for (let pos = 0; pos < scrollInfo.trackSize; pos++) {
                          const isThumb = (pos >= scrollInfo.thumbPosition && 
                                         pos < scrollInfo.thumbPosition + scrollInfo.thumbSize);
                          const char = isThumb ? '#' : '─';
                          setChar(a, this.x + 1 + pos, this.y + this.h - 2, char);
                      }
                  }
              }

              // Draw scrollbar corner intersection if both scrollbars present
              if (dims.vScrollNeeded && dims.hScrollNeeded) {
                  setChar(a, this.x + this.w - 2, this.y + this.h - 2, '+');
              }

              // Update cursor position based on window translation
              const { rel_row: relRow, rel_col: relCol } = win.translate(this.cursor);
              
              // Only show cursor if in focus and within visible content area
              if (this.hasFocus && 
                  relRow >= 0 && relRow < dims.contentHeight &&
                  relCol >= 0 && relCol < dims.contentWidth) {
                  this.cursorScreenPos = {
                      x: this.x + 1 + relCol,
                      y: this.y + 1 + relRow
                  };
              } else {
                  this.cursorScreenPos = { x: -1, y: -1 };
              }
          }

          // Calculate vertical scrollbar info based on content dimensions and scroll position
          getVerticalScrollbarInfo() {
              const dims = this._getContentDimensions();
              if (!dims.vScrollNeeded) return null;

              const trackSize = dims.contentHeight;
              const totalLines = this.buffer.length;
              const visibleLines = trackSize;

              const thumbSize = Math.max(1, Math.floor(trackSize * visibleLines / totalLines));
              const maxThumbPos = trackSize - thumbSize;
              const thumbPos = Math.min(maxThumbPos, Math.floor(trackSize * this.editorWindow.row / totalLines));
              const maxScrollOffset = totalLines - visibleLines;

              return {
                  trackSize,
                  thumbSize,
                  thumbPosition: thumbPos,
                  totalLines,
                  visibleLines,
                  maxScrollOffset
              };
          }

          // Calculate horizontal scrollbar info based on content dimensions and scroll position 
          getHorizontalScrollbarInfo() {
              const dims = this._getContentDimensions();
              if (!dims.hScrollNeeded) return null;

              const trackSize = dims.contentWidth;
              const totalCols = this.buffer.maxLineLength;
              const visibleCols = trackSize;

              const thumbSize = Math.max(1, Math.floor(trackSize * visibleCols / totalCols));
              const maxThumbPos = trackSize - thumbSize;
              const thumbPos = Math.min(maxThumbPos, Math.floor(trackSize * this.editorWindow.col / totalCols));
              const maxScrollOffset = totalCols - visibleCols;

              return {
                  trackSize,
                  thumbSize,
                  thumbPosition: thumbPos,
                  totalCols,
                  visibleCols,
                  maxScrollOffset
              };
          }

          // Update scroll position for vertical or horizontal scrolling
          updateScrollOffset(axis, newOffset) {
              let changed = false;
              
              if (axis === 'vertical') {
                  const info = this.getVerticalScrollbarInfo();
                  if (info) {
                      const clampedOffset = clamp(Math.round(newOffset), 0, info.maxScrollOffset);
                      if (this.editorWindow.row !== clampedOffset) {
                          this.editorWindow.row = clampedOffset;
                          changed = true;
                      }
                  }
              }
              else if (axis === 'horizontal') {
                  const info = this.getHorizontalScrollbarInfo();
                  if (info) {
                      const clampedOffset = clamp(Math.round(newOffset), 0, info.maxScrollOffset);
                      if (this.editorWindow.col !== clampedOffset) {
                          this.editorWindow.col = clampedOffset;
                          changed = true;
                      }
                  }
              }

              if (changed) {
                  this.resetCursorBlinkTimer();
              }
              return changed;
          }

          // Handle keyboard input for editor navigation and text manipulation
          handleKeyPress(e) {
              let handled = true;
              const key = e.key;
              const win = this.editorWindow;
              const buf = this.buffer;
              const cur = this.cursor;

              this.resetCursorBlinkTimer();

              // Ensure cursor stays within valid bounds
              cur.row = clamp(cur.row, 0, buf.bottom);
              cur._clamp_col(buf);
              win.down(buf, cur);
              win.horizontal_scroll(cur);

              if (key === "ArrowLeft") {
                  editorLeft(win, buf, cur);
              }
              else if (key === "ArrowRight") {
                  editorRight(win, buf, cur);
              }
              else if (key === "ArrowUp") {
                  cur.up(buf);
                  win.up(cur);
                  win.horizontal_scroll(cur);
              }
              else if (key === "ArrowDown") {
                  cur.down(buf);
                  win.down(buf, cur);
                  win.horizontal_scroll(cur);
              }
              else if (key === "Enter") {
                  buf.split(cur);
                  editorRight(win, buf, cur);
              }
              else if (key === "Backspace") {
                  if (cur.row > 0 || cur.col > 0) {
                      editorLeft(win, buf, cur);
                      buf.delete(cur);
                  }
              }
              else if (key === "Delete" || (e.ctrlKey && key === 'd')) {
                  buf.delete(cur);
              }
              else if (key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
                  buf.insert(cur, key);
                  for (let i = 0; i < key.length; i++) {
                      editorRight(win, buf, cur);
                  }
              }
              else {
                  handled = false;
              }

              if (handled) {
                  e.preventDefault();
                  drawTWidgets();
              }
              return handled;
          }

          // Handle mouse click for cursor positioning
          click(x, y) {
              super.click(x, y);
              this.resetCursorBlinkTimer();

              const dims = this._getContentDimensions();
              const relX = x - this.x - 1;
              const relY = y - this.y - 1;
              const win = this.editorWindow;

              if (relX >= 0 && relX < dims.contentWidth && relY >= 0 && relY < dims.contentHeight) {
                  const targetRow = win.row + relY;
                  const targetCol = win.col + relX;

                  this.cursor.row = clamp(targetRow, 0, this.buffer.bottom);
                  const lineLength = this.buffer.getLine(this.cursor.row).length;
                  this.cursor.col = clamp(targetCol, 0, lineLength);

                  win.up(this.cursor);
                  win.down(this.buffer, this.cursor);
                  win.horizontal_scroll(this.cursor);
                  drawTWidgets();
              }
          }

          // Handle mouse wheel scrolling
          scroll(delta) {
              const info = this.getVerticalScrollbarInfo();
              
              // Special case: allow scrolling down even without scrollbar if there's content below
              if (!info && delta > 0) {
                 if (this.buffer.length > 0 && this.editorWindow.row < this.buffer.bottom ) {
                    this.updateScrollOffset('vertical', this.editorWindow.row + 1);
                    drawTWidgets();
                    return true;
                 }
                 return false;
              }

              // No scrolling if no scrollbar
              if (!info) return false;

              const newOffset = this.editorWindow.row + Math.sign(delta);
              const changed = this.updateScrollOffset('vertical', newOffset);
              if (changed) {
                  drawTWidgets();
              }
              return changed;
          }
      }
