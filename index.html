      // TClockWidget: Displays an analog clock using ASCII characters
      class TClockWidget extends TWidget {
          constructor(posX, posY, width, height) {
              super(posX, posY, width, height, "Clock");
              this.hours = 0;
              this.minutes = 0;
              this.seconds = 0;
          }

          update() {
              const now = new Date();
              this.hours = now.getHours();
              this.minutes = now.getMinutes();
              this.seconds = now.getSeconds();
          }

          draw_content(charGrid) {
              // Calculate center point and radius
              const centerX = this.x + Math.floor((this.w - 1) / 2);
              const centerY = this.y + Math.floor((this.h - 1) / 2);
              const clockRadius = Math.min(
                  Math.floor((this.w - 2) / 2 / Y_TO_X_CHARS_DIMENSIONS_RATIO),
                  Math.floor((this.h - 2) / 2)
              );

              if (clockRadius < 1) return;

              // Draw clock numbers if enough space
              if (this.w >= 10 && this.h >= 5) {
                  this.drawClockNumber(charGrid, centerX, centerY, clockRadius, 12);
                  this.drawClockNumber(charGrid, centerX, centerY, clockRadius, 3);
                  this.drawClockNumber(charGrid, centerX, centerY, clockRadius, 6);
                  this.drawClockNumber(charGrid, centerX, centerY, clockRadius, 9);
              }

              // Calculate hand angles
              const secondAngle = this.seconds * 6;
              const minuteAngle = this.minutes * 6 + this.seconds / 10;
              const hourAngle = (this.hours % 12) * 30 + this.minutes / 2;

              // Draw clock hands
              this.drawClockHand(charGrid, centerX, centerY, secondAngle, clockRadius * 0.9, '.');
              this.drawClockHand(charGrid, centerX, centerY, minuteAngle, clockRadius * 0.7, 'M');
              this.drawClockHand(charGrid, centerX, centerY, hourAngle, clockRadius * 0.5, 'H');
              setChar(charGrid, centerX, centerY, 'o');
          }

          drawClockNumber(charGrid, centerX, centerY, radius, number) {
              const angleRadians = (number * 30 - 90) * Math.PI / 180;
              const posX = Math.round(centerX + radius * Math.cos(angleRadians) * Y_TO_X_CHARS_DIMENSIONS_RATIO);
              const posY = Math.round(centerY + radius * Math.sin(angleRadians));
              const numberText = number.toString();

              if (numberText.length === 1) {
                  setChar(charGrid, posX, posY, numberText);
              } else {
                  setChar(charGrid, posX - 1, posY, numberText[0]);
                  setChar(charGrid, posX, posY, numberText[1]);
              }
          }

          drawClockHand(charGrid, centerX, centerY, angleDegrees, handLength, handChar) {
              const angleRadians = (angleDegrees - 90) * Math.PI / 180;
              const endX = Math.round(centerX + handLength * Math.cos(angleRadians) * Y_TO_X_CHARS_DIMENSIONS_RATIO);
              const endY = Math.round(centerY + handLength * Math.sin(angleRadians));
              drawLine(charGrid, centerX, centerY, endX, endY, handChar);
          }
      }

      // TTextViewWidget: Displays scrollable text content
      class TTextViewWidget extends TWidget {
          constructor(posX, posY, width, height, title, content) {
              super(posX, posY, width, height, title);
              this.content = content;
              this.scrollOffset = 0;
              this.linesCache = null;
              this.lastContent = null;
              this.lastWidth = null;
          }

          _updateLinesCache() {
              const availableWidth = this.w - 2 - SCROLL_BAR_WIDTH_chars;
              if (availableWidth <= 0) {
                  this.linesCache = [];
                  return;
              }

              if (this.content !== this.lastContent || availableWidth !== this.lastWidth) {
                  this.linesCache = wrapText(this.content, availableWidth);
                  this.lastContent = this.content;
                  this.lastWidth = availableWidth;
              }
          }

          clearContents(charGrid) {
              const dimensions = this._getContentDimensions();
              for (let rowIndex = this.y + 1; rowIndex < this.y + 1 + dimensions.contentHeight; rowIndex++) {
                  for (let colIndex = this.x + 1; colIndex < this.x + 1 + dimensions.contentWidth; colIndex++) {
                      if (rowIndex < GRID_HEIGHT_chars && colIndex < GRID_WIDTH_chars) {
                          setChar(charGrid, colIndex, rowIndex, ' ');
                      }
                  }
              }
          }

          _getContentDimensions() {
              this._updateLinesCache();
              const maxHeight = Math.max(0, this.h - 2);
              const needsVerticalScroll = this.linesCache.length > maxHeight && 
                                        (this.w - 2 - 1) > 0 && maxHeight > 0;
              const verticalScrollWidth = needsVerticalScroll ? 1 : 0;
              const contentWidth = Math.max(0, this.w - 2 - verticalScrollWidth);
              const contentHeight = maxHeight;

              return {
                  vScrollNeeded: needsVerticalScroll,
                  contentWidth: contentWidth,
                  contentHeight: contentHeight
              };
          }

          draw_content(charGrid) {
              const dimensions = this._getContentDimensions();
              const lines = this.linesCache;

              if (dimensions.contentWidth <= 0 || dimensions.contentHeight <= 0) return;

              // Draw text content
              for (let rowIndex = 0; rowIndex < dimensions.contentHeight; rowIndex++) {
                  const lineIndex = rowIndex + this.scrollOffset;
                  const screenY = this.y + 1 + rowIndex;

                  if (lineIndex >= 0 && lineIndex < lines.length) {
                      const currentLine = lines[lineIndex];
                      for (let colIndex = 0; colIndex < dimensions.contentWidth; colIndex++) {
                          const screenX = this.x + 1 + colIndex;
                          const character = colIndex < currentLine.length ? currentLine[colIndex] : ' ';
                          setChar(charGrid, screenX, screenY, character);
                      }
                  } else {
                      for (let colIndex = 0; colIndex < dimensions.contentWidth; colIndex++) {
                          setChar(charGrid, this.x + 1 + colIndex, screenY, ' ');
                      }
                  }
              }

              // Draw scrollbar if needed
              if (dimensions.vScrollNeeded) {
                  this.drawScrollbar(charGrid, lines.length, dimensions.contentHeight);
              }
          }

          drawScrollbar(charGrid, totalLines, viewportHeight) {
              const scrollbarHeight = viewportHeight;
              const scrollbarX = this.x + this.w - 2;

              if (scrollbarHeight <= 0) return;

              const thumbSize = Math.max(1, Math.floor(scrollbarHeight * viewportHeight / totalLines));
              const maxThumbPos = scrollbarHeight - thumbSize;
              const thumbPos = Math.min(maxThumbPos, Math.floor(scrollbarHeight * this.scrollOffset / totalLines));

              for (let posIndex = 0; posIndex < scrollbarHeight; posIndex++) {
                  const scrollChar = (posIndex >= thumbPos && posIndex < thumbPos + thumbSize) ? '#' : '│';
                  setChar(charGrid, scrollbarX, this.y + 1 + posIndex, scrollChar);
              }
          }

          updateDimensions(newWidth, newHeight) {
              super.updateDimensions(newWidth, newHeight);
              this.linesCache = null;
              this.lastWidth = null;

              const dimensions = this._getContentDimensions();
              const maxScroll = Math.max(0, (this.linesCache?.length || 0) - dimensions.contentHeight);
              this.scrollOffset = clamp(this.scrollOffset, 0, maxScroll);
          }

          getVerticalScrollbarInfo() {
              const dimensions = this._getContentDimensions();
              if (!dimensions.vScrollNeeded) return null;

              const trackSize = dimensions.contentHeight;
              const totalLines = this.linesCache.length;
              const visibleLines = trackSize;
              const thumbSize = Math.max(1, Math.floor(trackSize * visibleLines / totalLines));
              const maxThumbPos = trackSize - thumbSize;
              const thumbPos = Math.min(maxThumbPos, Math.floor(trackSize * this.scrollOffset / totalLines));
              const maxScrollOffset = totalLines - visibleLines;

              return {
                  trackSize,
                  thumbSize,
                  thumbPosition: thumbPos,
                  totalLines,
                  visibleLines,
                  maxScrollOffset
              };
          }

          updateScrollOffset(axis, newOffset) {
              if (axis === 'vertical') {
                  const info = this.getVerticalScrollbarInfo();
                  if (info) {
                      const clampedOffset = clamp(Math.round(newOffset), 0, info.maxScrollOffset);
                      if (this.scrollOffset !== clampedOffset) {
                          this.scrollOffset = clampedOffset;
                          return true;
                      }
                  }
              }
              return false;
          }

          scroll(delta) {
              const info = this.getVerticalScrollbarInfo();
              if (!info) return false;

              const newOffset = this.scrollOffset + Math.sign(delta);
              const changed = this.updateScrollOffset('vertical', newOffset);
              if (changed) {
                  drawTWidgets();
              }
              return changed;
          }
      }

      // TStatusWidget: Displays status messages at the bottom of the screen
      class TStatusWidget extends TWidget {
          constructor(posX, posY, width, height) {
              super(posX, posY, width, height, "Status");
              this.content = "";
              this.isStatusTWidget = true;
          }

          // Override border drawing methods to customize appearance
          draw_bottomBorder(charGrid) { }
          draw_shadow(charGrid, isTopWidget) { }
          draw_close_button(charGrid) { }
          
          // Keep resize handle for resizability
          
          draw_corners(charGrid) {
              setChar(charGrid, this.x, this.y, '┌');
              setChar(charGrid, this.x + this.w - 1, this.y, '┐');
          }

          draw_content(charGrid) {
              const innerWidth = this.w - 2;
              const innerHeight = this.h - 2;

              if (innerWidth <= 0 || innerHeight <= 0) return;

              const textLines = wrapText(this.content, innerWidth);
              const firstLine = textLines[0] || "";
              const contentY = this.y + 1;

              // Draw first line
              for (let charIndex = 0; charIndex < innerWidth; charIndex++) {
                  const posX = this.x + 1 + charIndex;
                  const character = charIndex < firstLine.length ? firstLine[charIndex] : ' ';
                  setChar(charGrid, posX, contentY, character);
              }

              // Show ellipsis if content is truncated
              if (textLines.length > 1 || firstLine.length > innerWidth) {
                  const endX = this.x + innerWidth;
                  if (endX > this.x + 3) {
                      setChar(charGrid, endX - 2, contentY, '.');
                      setChar(charGrid, endX - 1, contentY, '.');
                      setChar(charGrid, endX, contentY, '.');
                  }
              }
          }

          setMessage(message) {
              if (this.content !== message) {
                  this.content = message;
                  return true;
              }
              return false;
          }
      }

      // TMenuWidget: Implements a menu system with submenus
      class TMenuWidget extends TWidget {
          constructor(posX, posY, width, height, title, menuItems, pinned = true, parentMenu = null) {
              const requiredHeight = menuItems.length + 2;
              const adjustedHeight = Math.max(height, requiredHeight);
              super(posX, posY, width, adjustedHeight, title);
              this.menuItems = menuItems;
              this.selectedIndex = -1;
              this.subMenu = null;
              this.pinned = pinned;
              this.parentMenu = parentMenu;
              this.isOpen = true;
          }

          closeSubMenu() {
              if (this.subMenu) {
                  this.subMenu.closeAll();
                  this.subMenu.destroy();
                  this.subMenu = null;
              }
          }

          closeAll() {
              this.closeSubMenu();
              this.isOpen = false;
              this.destroy();
          }

          selectNext() {
              if (!this.menuItems.length) return;
              this.closeSubMenu();
              this.selectedIndex = (this.selectedIndex + 1) % this.menuItems.length;
              this._openSubMenuIfNeeded();
          }

          selectPrevious() {
              if (!this.menuItems.length) return;
              this.closeSubMenu();
              this.selectedIndex = (this.selectedIndex - 1 + this.menuItems.length) % this.menuItems.length;
              this._openSubMenuIfNeeded();
          }

          selectIndex(index) {
              if (index >= 0 && index < this.menuItems.length && index !== this.selectedIndex) {
                  this.closeSubMenu();
                  this.selectedIndex = index;
                  this._openSubMenuIfNeeded();
                  return true;
              }
              return false;
          }

          _openSubMenuIfNeeded() {
              if (this.selectedIndex === -1) return;

              const item = this.menuItems[this.selectedIndex];
              if (item.subMenu) {
                  const subMenuX = this.x + this.w - 1;
                  const subMenuY = this.y + 1 + this.selectedIndex;
                  const subMenuWidth = this.w;
                  const subMenuHeight = item.subMenu.length + 2;

                  this.subMenu = new TMenuWidget(
                      subMenuX,
                      subMenuY,
                      subMenuWidth,
                      subMenuHeight,
                      item.label,
                      item.subMenu,
                      false,
                      this
                  );
                  tWidgets.push(this.subMenu);
                  bringToFront(this.subMenu);
              }
          }

          activate() {
              if (this.selectedIndex === -1 || !this.menuItems.length) {
                  return;
              }

              const item = this.menuItems[this.selectedIndex];
              if (item.subMenu) {
                  const subMenuIsValid = this.subMenu && tWidgets.includes(this.subMenu);
                  if (subMenuIsValid) {
                      setActiveWidget(this.subMenu);
                      if (this.subMenu.menuItems.length > 0) {
                          this.subMenu.selectedIndex = 0;
                      }
                  } else {
                      this.closeSubMenu();
                      this._openSubMenuIfNeeded();
                      if (this.subMenu) {
                          setActiveWidget(this.subMenu);
                          if (this.subMenu.menuItems.length > 0) {
                              this.subMenu.selectedIndex = 0;
                          }
                      }
                  }
              } else if (item.callback) {
                  item.callback();
                  let current = this;
                  while (current && !current.pinned) {
                      const parent = current.parentMenu;
                      current.closeAll();
                      current = parent;
                  }
                  if (!current) {
                      activeWidget = null;
                  } else {
                      setActiveWidget(current);
                  }
              }
          }

          click(posX, posY) {
              super.click(posX, posY);
              const clickedItemIndex = posY - this.y - 1;
              if (clickedItemIndex >= 0 && clickedItemIndex < this.menuItems.length) {
                  this.selectIndex(clickedItemIndex);
                  this.activate();
              }
          }

          scroll(scrollDelta) { }

          draw(charGrid, isTopWidget = false) {
              super.draw(charGrid, isTopWidget);

              for (let itemIndex = 0; itemIndex < this.menuItems.length; itemIndex++) {
                  const menuItem = this.menuItems[itemIndex];
                  const isSelected = itemIndex === this.selectedIndex;
                  let prefix = isSelected ? "> " : "  ";
                  let suffix = menuItem.subMenu ? " ->" : "   ";

                  const maxLabelWidth = this.w - 2 - prefix.length - suffix.length;
                  const truncatedLabel = menuItem.label.substring(0, maxLabelWidth);
                  const menuItemText = prefix + truncatedLabel + suffix;
                  const rowPosition = this.y + 1 + itemIndex;

                  // Draw menu item
                  for (let charIndex = 0; charIndex < menuItemText.length; charIndex++) {
                      const colPosition = this.x + 1 + charIndex;
                      setChar(charGrid, colPosition, rowPosition, menuItemText[charIndex]);
                  }

                  // Fill remaining space with spaces
                  for (let spaceIndex = menuItemText.length; spaceIndex < this.w - 2; spaceIndex++) {
                      const colPosition = this.x + 1 + spaceIndex;
                      setChar(charGrid, colPosition, rowPosition, ' ');
                  }
              }
          }

          draw_close_button(charGrid) {
              if (!this.pinned) {
                  super.draw_close_button(charGrid);
              }
          }

          handleKeyPress(event) {
              let handled = true;
              const key = event.key;

              switch (key) {
                  case "ArrowUp":
                      this.selectPrevious();
                      break;
                  case "ArrowDown":
                      this.selectNext();
                      break;
                  case "ArrowRight":
                  case "Enter":
                      this.activate();
                      break;
                  case "ArrowLeft":
                      if (this.parentMenu) {
                          this.closeAll();
                          setActiveWidget(this.parentMenu);
                      } else {
                          handled = false;
                      }
                      break;
                  case "Escape":
                      let menu = this;
                      if (menu.pinned && !menu.parentMenu) {
                          this.closeSubMenu();
                          this.selectedIndex = -1;
                      } else {
                          while (menu && !menu.pinned) {
                              const parent = menu.parentMenu;
                              menu.closeAll();
                              menu = parent;
                          }
                          if (menu) {
                              setActiveWidget(menu);
                              menu.selectedIndex = -1;
                              menu.closeSubMenu();
                          } else {
                              activeWidget = null;
                          }
                      }
                      break;
                  default:
                      handled = false;
              }

              if (handled) {
                  event.preventDefault();
                  drawTWidgets();
              }
              return handled;
          }
      }

      // Helper functions for drawing and text manipulation
      function setChar(charGrid, posX, posY, character) {
          if (posX >= 0 && posX < GRID_WIDTH_chars && posY >= 0 && posY < GRID_HEIGHT_chars) {
              if (typeof character !== 'string') character = ' ';
              charGrid[posY][posX] = character;
          }
      }

      function wrapText(text, maxWidth) {
          if (!text || maxWidth <= 0) return [];
          const textLines = text.split('\n');
          const wrappedLines = [];

          textLines.forEach(textLine => {
              if (textLine.length <= maxWidth) {
                  wrappedLines.push(textLine);
              } else {
                  const words = textLine.split(' ');
                  let currentLine = '';

                  words.forEach(word => {
                      if (currentLine.length === 0) {
                          if (word.length > maxWidth) {
                              wrappedLines.push(word.substring(0, maxWidth));
                              currentLine = '';
                          } else {
                              currentLine = word;
                          }
                      } else if (currentLine.length + word.length + 1 <= maxWidth) {
                          currentLine += ' ' + word;
                      } else {
                          wrappedLines.push(currentLine);
                          if (word.length > maxWidth) {
                              wrappedLines.push(word.substring(0, maxWidth));
                              currentLine = '';
                          } else {
                              currentLine = word;
                          }
                      }
                  });

                  if (currentLine) {
                      wrappedLines.push(currentLine);
                  }
              }
          });

          return wrappedLines;
      }

      function drawLine(charGrid, startX, startY, endX, endY, lineChar) {
          startX = Math.round(startX);
          startY = Math.round(startY);
          endX = Math.round(endX);
          endY = Math.round(endY);

          const deltaX = Math.abs(endX - startX);
          const deltaY = Math.abs(endY - startY);
          const stepX = startX < endX ? 1 : -1;
          const stepY = startY < endY ? 1 : -1;
          let error = deltaX - deltaY;

          while (true) {
              setChar(charGrid, startX, startY, lineChar);
              if (startX === endX && startY === endY) break;

              const errorDouble = 2 * error;
              if (errorDouble > -deltaY) {
                  error -= deltaY;
                  startX += stepX;
              }
              if (errorDouble < deltaX) {
                  error += deltaX;
                  startY += stepY;
              }
          }
      }

      // Main application logic
      let tWidgets = [];
      let activeWidget = null;
      let widgetBeingMovedOrResized = null;
      let dragOffsetX, dragOffsetY;
      let mouseIsPressed = false;
      let isDragging = false;
      let isResizing = false;
      let isDraggingScrollbar = false;
      let scrollbarDragWidget = null;
      let scrollbarDragAxis = null;
      let scrollbarDragStartY = 0;
      let scrollbarDragStartX = 0;
      let scrollbarDragStartOffset = 0;
      let statusWidget = null;

      // Get random coordinates for a new widget, ensuring it fits within grid bounds
      function getRandomCoordinates(widgetWidth, widgetHeight) {
          const maxX = Math.max(0, GRID_WIDTH_chars - widgetWidth - 1);
          const maxY = Math.max(0, GRID_HEIGHT_chars - widgetHeight - STATUS_WINDOW_HEIGHT_chars - 1);
          const posX = Math.floor(Math.random() * maxX);
          const posY = Math.floor(Math.random() * maxY);
          return { x: posX, y: posY };
      }

      // Create a new text editor widget at random position
      function createEditor() {
          const { x, y } = getRandomCoordinates(DEFAULT_WINDOW_WIDTH_chars + 5, DEFAULT_WINDOW_HEIGHT_chars + 5);
          const width = DEFAULT_WINDOW_WIDTH_chars + 5;
          const height = DEFAULT_WINDOW_HEIGHT_chars + 5;
          const title = `Editor ${tWidgets.filter(w => w instanceof TEditorWidget).length + 1}`;
          const initialText = `Welcome to TEditorWidget!\n\n` +
              `- Use Arrow Keys to move.\n` +
              `- Type characters to insert.\n` +
              `- Backspace/Delete to remove text.\n` +
              `- Enter to split lines.\n` +
              `- Mouse wheel scrolls vertically.\n` +
              `- Click to position cursor.\n\n` +
              loremIpsum.substring(0, 200) + "...";

          const editor = new TEditorWidget(x, y, width, height, title, initialText);
          tWidgets.push(editor);
          bringToFrontAndFocus(editor);
          drawTWidgets();
      }

      // Create a new clock widget at random position
      function createClock() {
          const { x, y } = getRandomCoordinates(CLOCK_WIDTH_chars, CLOCK_HEIGHT_chars);
          const clock = new TClockWidget(x, y, CLOCK_WIDTH_chars, CLOCK_HEIGHT_chars);
          tWidgets.push(clock);
          bringToFrontAndFocus(clock);
          clock.update();
          
          // Start clock update interval if not already running
          if (typeof clockUpdateInterval === 'undefined' || !clockUpdateInterval) {
              clockUpdateInterval = setInterval(updateClocks, CLOCK_UPDATE_INTERVAL_ms);
          }
          drawTWidgets();
      }

      let clockUpdateInterval = null;

      // Update all clock widgets in the system
      function updateClocks() {
          let needsRedraw = false;
          tWidgets.forEach(widget => {
              if (widget instanceof TClockWidget) {
                  widget.update();
                  needsRedraw = true;
              }
          });
          if (needsRedraw) drawTWidgets();
      }

      // Create a new text view widget at random position
      function createTextWidget() {
          const { x, y } = getRandomCoordinates(DEFAULT_WINDOW_WIDTH_chars, DEFAULT_WINDOW_HEIGHT_chars);
          const width = DEFAULT_WINDOW_WIDTH_chars;
          const height = DEFAULT_WINDOW_HEIGHT_chars;
          const title = `TextView ${tWidgets.filter(w => w instanceof TTextViewWidget && !(w instanceof TStatusWidget)).length + 1}`;
          const content = loremIpsum;

          const textView = new TTextViewWidget(x, y, width, height, title, content);
          tWidgets.push(textView);
          bringToFrontAndFocus(textView);
          drawTWidgets();
      }

      // Create the status widget at the bottom of the screen if it doesn't exist
      function createStatusTWidget() {
          if (statusWidget) return;
          const height = STATUS_WINDOW_HEIGHT_chars;
          statusWidget = new TStatusWidget(0, GRID_HEIGHT_chars - height, GRID_WIDTH_chars, height);
          tWidgets.unshift(statusWidget);
      }

      // Show a message in the status widget
      function showStatusMessage(message) {
          if (statusWidget) {
              const changed = statusWidget.setMessage(message);
              if (changed) drawTWidgets();
          }
      }

      // Clear the status message
      function hideStatusMessage() {
          showStatusMessage("");
      }

      // Create either a clock or text widget based on current widget count
      function createRandomTWidget() {
          const choice = tWidgets.length % 3;
          if (choice === 0) {
              createClock();
          } else if (choice === 1) {
              createTextWidget();
          } else {
              createEditor();
          }
      }

      let currentCursorPos = { x: -1, y: -1 };

      /** 
       * Redraws all widgets onto the character grid.
       * Clears the grid, draws each widget in order, and updates cursor position if needed.
       */
      function drawTWidgets() {
          // Reset cursor position
          currentCursorPos = { x: -1, y: -1 };

          // Create empty character grid
          let characterGrid = Array(GRID_HEIGHT_chars)
              .fill(null)
              .map(() => Array(GRID_WIDTH_chars).fill(' '));

          // Draw each widget
          tWidgets.forEach((widget, widgetIndex) => {
              const isTopWidget = (widget === activeWidget) || widgetIndex === tWidgets.length - 1;
              widget.draw(characterGrid, isTopWidget);

              // Update cursor position if this is the active editor
              if (widget === activeWidget && widget instanceof TEditorWidget) {
                  currentCursorPos = widget.cursorScreenPos;
              }
          });

          emitHTML(characterGrid);
      }

      /**
       * Finds the topmost widget at the given character coordinates.
       * Searches widgets from top to bottom in the drawing order.
       * Ignores the status widget.
       */
      function findWidgetAt(mouseX_chars, mouseY_chars) {
          // Search widgets from top to bottom
          for (let widgetIndex = tWidgets.length - 1; widgetIndex >= 0; widgetIndex--) {
              const widget = tWidgets[widgetIndex];
              
              // Calculate widget boundaries
              const widgetStartX = widget.x;
              const widgetEndX = widget.x + widget.w;
              const widgetStartY = widget.y; 
              const widgetEndY = widget.y + widget.h;

              // Check if coordinates are within widget bounds
              const isXWithinBounds = mouseX_chars >= widgetStartX && mouseX_chars < widgetEndX;
              const isYWithinBounds = mouseY_chars >= widgetStartY && mouseY_chars < widgetEndY;

              if (isXWithinBounds && isYWithinBounds) {
                  return { widget: widget, index: widgetIndex };
              }
          }
          return null;
      }

      /** 
       * Sets the currently active widget, handling focus gain/loss.
       * @param {TWidget} widget - The widget to make active
       */
      function setActiveWidget(widget) {
          const oldWidget = activeWidget;
          if (oldWidget === widget) return;

          // Remove focus from previous active widget
          if (oldWidget) {
              oldWidget.loseFocus();
          }

          // Set and focus new active widget
          activeWidget = widget;
          if (activeWidget) {
              activeWidget.gainFocus();
          }
      }

      /** 
       * Moves a widget to the end of the array (drawing order) and sets focus.
       * This makes the widget appear on top and become active.
       * @param {TWidget} widget - The widget to bring to front and focus
       */
      function bringToFrontAndFocus(widget) {
          if (!widget) return;

          // Only move if not already at end
          const index = tWidgets.indexOf(widget);
          if (index > -1 && index < tWidgets.length - 1) {
              tWidgets.splice(index, 1);
              tWidgets.push(widget);
          }

          setActiveWidget(widget);
      }

      /**
       * Moves a widget to the end of the array (drawing order) without changing focus.
       * This makes the widget appear on top but does not make it active.
       * @param {TWidget} widget - The widget to bring to front
       */
      function bringToFront(widget) {
          if (!widget) return;

          // Only move if not already at end
          const index = tWidgets.indexOf(widget);
          if (index > -1 && index < tWidgets.length - 1) {
              tWidgets.splice(index, 1); 
              tWidgets.push(widget);
          }
      }

      // --- Event Handlers ---

      function handleMouseDown(e) {
          // Get mouse coordinates in character units
          const { mouseX_chars, mouseY_chars } = getMouseCoords_chars(e);
          const result = findWidgetAt(mouseX_chars, mouseY_chars);
          
          // Reset mouse state
          mouseIsPressed = true;
          isDragging = false;
          isResizing = false;
          isDraggingScrollbar = false;
          widgetBeingMovedOrResized = result ? result.widget : null;
          scrollbarDragWidget = null;

          if (result) {
              const { widget } = result;
              
              // Bring widget to front if not already active
              if (widget !== activeWidget) {
                  bringToFrontAndFocus(widget);
                  drawTWidgets();
              }

              // Calculate relative coordinates within widget
              const innerX = mouseX_chars - widget.x;
              const innerY = mouseY_chars - widget.y;
              
              // Get scrollbar info if widget supports it
              let vScrollInfo = widget.getVerticalScrollbarInfo ? widget.getVerticalScrollbarInfo() : null;
              let hScrollInfo = widget.getHorizontalScrollbarInfo ? widget.getHorizontalScrollbarInfo() : null;

              // Check if clicking vertical scrollbar thumb
              if (vScrollInfo && 
                  mouseX_chars === widget.x + widget.w - 2 && 
                  innerY > 0 && 
                  innerY <= vScrollInfo.trackSize && 
                  innerY >= vScrollInfo.thumbPosition && 
                  innerY < vScrollInfo.thumbPosition + vScrollInfo.thumbSize) {
                  
                  isDraggingScrollbar = true;
                  scrollbarDragWidget = widget;
                  scrollbarDragAxis = 'vertical';
                  scrollbarDragStartY = mouseY_chars;
                  scrollbarDragStartOffset = (widget instanceof TEditorWidget) ? widget.editorWindow.row : widget.scrollOffset;
                  widgetBeingMovedOrResized = null;
                  showStatusMessage(`Scrolling ${widget.title}...`);
                  return;
              }

              // Check if clicking horizontal scrollbar thumb
              if (hScrollInfo && 
                  mouseY_chars === widget.y + widget.h - 2 && 
                  innerX > 0 && 
                  innerX <= hScrollInfo.trackSize && 
                  innerX >= hScrollInfo.thumbPosition && 
                  innerX < hScrollInfo.thumbPosition + hScrollInfo.thumbSize) {
                  
                  isDraggingScrollbar = true;
                  scrollbarDragWidget = widget;
                  scrollbarDragAxis = 'horizontal';
                  scrollbarDragStartX = mouseX_chars;
                  scrollbarDragStartOffset = (widget instanceof TEditorWidget) ? widget.editorWindow.col : 0;
                  widgetBeingMovedOrResized = null;
                  showStatusMessage(`Scrolling ${widget.title}...`);
                  return;
              }

              // Calculate positions for close button and resize handle
              const closeX = widget.x + widget.w - 2;
              const closeY = widget.y;
              const resizeX = widget.x + widget.w - 1;
              const resizeY = widget.y + widget.h - 1;
              const isTitleY = (mouseY_chars === widget.y);
              const canClose = (widget !== statusWidget) && !(widget === menuWidget && widget.pinned);

              // Handle close button click
              if (canClose && mouseX_chars === closeX && isTitleY && widget.w >= 4) {
                  widget.destroy();
                  setActiveWidget(null);
                  widgetBeingMovedOrResized = null;
                  drawTWidgets();
                  return;
              }
              // Handle resize handle click
              else if (mouseX_chars === resizeX && mouseY_chars === resizeY) {
                  isResizing = true;
                  showStatusMessage("Resizing " + widget.title);
              }
              // Handle title bar drag
              else if (isTitleY && mouseX_chars > widget.x && mouseX_chars < closeX) {
                  isDragging = true;
                  dragOffsetX = mouseX_chars - widget.x;
                  dragOffsetY = mouseY_chars - widget.y;
                  showStatusMessage("Dragging " + widget.title);
              }
              // Handle content area drag for Clock and TextView
              else if (!(widget instanceof TEditorWidget) && !(widget instanceof TMenuWidget)) {
                  isDragging = true;
                  dragOffsetX = mouseX_chars - widget.x;
                  dragOffsetY = mouseY_chars - widget.y;
                  showStatusMessage("Dragging " + widget.title);
              }
          } else {
              // Clicked on background
              widgetBeingMovedOrResized = null;
              if (activeWidget instanceof TMenuWidget && !activeWidget.pinned) {
                  activeWidget.closeAll();
                  drawTWidgets();
              }
          }
      }

      function handleMouseMove(e) {
          // Handle scrollbar dragging
          if (isDraggingScrollbar && scrollbarDragWidget) {
              const { mouseX_chars, mouseY_chars } = getMouseCoords_chars(e);
              let needsRedraw = false;
              let scrollInfo = null;
              let mouseDelta = 0;
              let newScrollOffset = 0;

              if (scrollbarDragAxis === 'vertical') {
                  scrollInfo = scrollbarDragWidget.getVerticalScrollbarInfo();
                  if (scrollInfo && scrollInfo.trackSize > 0 && scrollInfo.maxScrollOffset > 0) {
                      mouseDelta = mouseY_chars - scrollbarDragStartY;
                      const offsetPerChar = scrollInfo.maxScrollOffset / Math.max(1, scrollInfo.trackSize - scrollInfo.thumbSize);
                      newScrollOffset = scrollbarDragStartOffset + (mouseDelta * offsetPerChar);
                      needsRedraw = scrollbarDragWidget.updateScrollOffset('vertical', newScrollOffset);
                  }
              } else if (scrollbarDragAxis === 'horizontal') {
                  scrollInfo = scrollbarDragWidget.getHorizontalScrollbarInfo();
                  if (scrollInfo && scrollInfo.trackSize > 0 && scrollInfo.maxScrollOffset > 0) {
                      mouseDelta = mouseX_chars - scrollbarDragStartX;
                      const offsetPerChar = scrollInfo.maxScrollOffset / Math.max(1, scrollInfo.trackSize - scrollInfo.thumbSize);
                      newScrollOffset = scrollbarDragStartOffset + (mouseDelta * offsetPerChar);
                      needsRedraw = scrollbarDragWidget.updateScrollOffset('horizontal', newScrollOffset);
                  }
              }

              if (needsRedraw) {
                  drawTWidgets();
              }
              return;
          }

          // Handle widget dragging and resizing
          if (mouseIsPressed && (widgetBeingMovedOrResized || isDragging || isResizing)) {
              const { mouseX_chars, mouseY_chars } = getMouseCoords_chars(e);
              
              if (!widgetBeingMovedOrResized || (!isDragging && !isResizing)) return;
              
              let needsRedraw = false;
              const widget = widgetBeingMovedOrResized;

              if (isResizing) {
                  // Calculate new dimensions while respecting minimums
                  const newWidth = Math.max(MIN_WINDOW_WIDTH_chars, mouseX_chars - widget.x + 1);
                  const newHeight = Math.max(MIN_WINDOW_HEIGHT_chars, mouseY_chars - widget.y + 1);
                  
                  // Clamp dimensions to grid boundaries
                  const clampedWidth = Math.min(newWidth, GRID_WIDTH_chars - widget.x);
                  const clampedHeight = Math.min(newHeight, GRID_HEIGHT_chars - widget.y);
                  
                  if (widget.w !== clampedWidth || widget.h !== clampedHeight) {
                      widget.updateDimensions(clampedWidth, clampedHeight);
                      needsRedraw = true;
                  }
              } else if (isDragging) {
                  // Calculate new position
                  const newPosX = mouseX_chars - dragOffsetX;
                  const newPosY = mouseY_chars - dragOffsetY;
                  
                  // Clamp position to keep widget in bounds
                  const maxPosY = GRID_HEIGHT_chars - widget.h - STATUS_WINDOW_HEIGHT_chars;
                  const clampedPosX = clamp(newPosX, 0, GRID_WIDTH_chars - widget.w);
                  const clampedPosY = clamp(newPosY, 0, maxPosY);
                  
                  if (widget.x !== clampedPosX || widget.y !== clampedPosY) {
                      widget.x = clampedPosX;
                      widget.y = clampedPosY;
                      needsRedraw = true;
                  }
              }

              if (needsRedraw) {
                  drawTWidgets();
              }
          }
      }

      /**
       * Handles mouse up events, including scrollbar dragging, widget clicking, and cleanup
       */
      function handleMouseUp(e) {
          // Handle end of scrollbar dragging
          if (isDraggingScrollbar) {
              isDraggingScrollbar = false;
              scrollbarDragWidget = null;
              scrollbarDragAxis = null;
              hideStatusMessage();
              mouseIsPressed = false;
              return;
          }

          // Handle widget clicks when not dragging/resizing
          if (mouseIsPressed) {
              if (!isDragging && !isResizing && widgetBeingMovedOrResized) {
                  const { mouseX_chars, mouseY_chars } = getMouseCoords_chars(e);
                  const result = findWidgetAt(mouseX_chars, mouseY_chars);
                  if (result && result.widget === widgetBeingMovedOrResized && result.widget === activeWidget) {
                      result.widget.click(mouseX_chars, mouseY_chars);
                      drawTWidgets();
                  }
              }
          }

          // Clean up status message if was dragging/resizing
          if (isDragging || isResizing) {
              hideStatusMessage();
          }

          // Reset all mouse state
          widgetBeingMovedOrResized = null;
          mouseIsPressed = false;
          isDragging = false;
          isResizing = false;
      }

      /**
       * Handles mouse wheel events for scrolling widgets
       */
      function handleWheel(e) {
          const { mouseX_chars, mouseY_chars } = getMouseCoords_chars(e);
          const result = findWidgetAt(mouseX_chars, mouseY_chars);
          
          if (result) {
              const scrolled = result.widget.scroll(Math.sign(e.deltaY));
              if (scrolled) {
                  e.preventDefault();
              }
          }
      }

      /**
       * Handles keyboard events for the active widget
       */
      function handleKeyDown(e) {
          if (activeWidget) {
              activeWidget.handleKeyPress(e);
          }
      }

      // --- Initialization and Drawing ---
      /** 
       * Calculates character grid coordinates from pixel coordinates.
       * Converts mouse pixel coordinates relative to the grid element into character-based coordinates.
       */
      function getMouseCoords_chars(mouseEvent) {
          const gridRect = charactersGridElement.getBoundingClientRect();
          const { clientX, clientY } = mouseEvent;
          const { left, top } = gridRect;
          
          // Calculate pixel offsets from grid element edge
          const mousePosXInPixels = clientX - left;
          const mousePosYInPixels = clientY - top;
          
          // Convert to character coordinates, defaulting to 0 if dimensions not set
          const mouseX_chars = charWidth_px > 0 ? Math.floor(mousePosXInPixels / charWidth_px) : 0;
          const mouseY_chars = charHeight_px > 0 ? Math.floor(mousePosYInPixels / charHeight_px) : 0;
          
          return { mouseX_chars, mouseY_chars };
      }

      /** 
       * Renders the character grid array to HTML.
       * Handles special cases for cursor, close button, and resize handle rendering.
       */
      function emitHTML(characterGrid) {
          let htmlOutput = '';
          for (let rowIndex = 0; rowIndex < GRID_HEIGHT_chars; rowIndex++) {
              for (let colIndex = 0; colIndex < GRID_WIDTH_chars; colIndex++) {
                  let character = characterGrid[rowIndex]?.[colIndex] || ' ';

                  // Handle cursor position in editor widgets
                  if (colIndex === currentCursorPos.x && rowIndex === currentCursorPos.y && activeWidget instanceof TEditorWidget) {
                      const displayChar = (character === ' ') ? ' ' : escapeHtml(character);
                      const blinkClass = activeWidget.isCursorBlinking ? ' cursor-blink' : '';
                      htmlOutput += `<span class="cursor${blinkClass}">${displayChar}</span>`;
                  }
                  // Handle close button 'X' character
                  else if (character === 'X' && rowIndex > 0 && colIndex > 0 && characterGrid[rowIndex]?.[colIndex+1] === '┐') {
                      htmlOutput += `<span class="close-button">X</span>`;
                  }
                  // Handle resize handle character
                  else if (character === '◢') {
                      htmlOutput += '<span class="resize-handle">◢</span>';
                  }
                  // Handle regular characters
                  else {
                      htmlOutput += escapeHtml(character);
                  }
              }
              htmlOutput += '\n';
          }
          charactersGridElement.innerHTML = htmlOutput;
      }

      /** Escapes characters for safe HTML embedding. */
      function escapeHtml(unsafeText) {
          if (typeof unsafeText !== 'string') return unsafeText;
          if (unsafeText.startsWith('&#') && unsafeText.endsWith(';')) return unsafeText;
          return unsafeText
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;") 
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&apos;");
      }

      // --- Constants ---

      // Window dimensions
      const Y_TO_X_CHARS_DIMENSIONS_RATIO = 1.6;
      const DEFAULT_WINDOW_WIDTH_chars = 35;
      const DEFAULT_WINDOW_HEIGHT_chars = 15;
      const MIN_WINDOW_WIDTH_chars = 10;
      const MIN_WINDOW_HEIGHT_chars = 5;
      const STATUS_WINDOW_HEIGHT_chars = 3;

      // Clock widget constants
      const CLOCK_HEIGHT_chars = 12;
      const CLOCK_WIDTH_chars = Math.round(CLOCK_HEIGHT_chars * Y_TO_X_CHARS_DIMENSIONS_RATIO);
      const CLOCK_UPDATE_INTERVAL_ms = 1000;

      // UI elements
      const LIGHT_SHADE = '░';
      const MEDIUM_SHADE = '▒';
      const SCROLL_BAR_WIDTH_chars = 1;

      // Sample text
      const loremIpsum = "Lorem ipsum dolor sit amet, consectetur adipiscing elit. " +
          "Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. " +
          "Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris " +
          "nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in " +
          "reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla " +
          "pariatur. Excepteur sint occaecat cupidatat non proident, sunt in " +
          "culpa qui officia deserunt mollit anim id est laborum.";

      // --- Initialization Variables ---
      let menuWidget;
      let charWidth_px, charHeight_px;
      let GRID_WIDTH_chars, GRID_HEIGHT_chars;
      const charactersGridElement = document.getElementById('characters-grid');

      /** 
       * Measures monospace character dimensions by creating a temporary element.
       * Returns character width and height in pixels.
       */
      function measureMonospaceFontDimensions(fontSize) {
          const testSpan = document.createElement('span');
          testSpan.style.fontFamily = 'monospace';
          testSpan.style.fontSize = `${fontSize}px`;
          testSpan.style.position = 'absolute';
          testSpan.style.visibility = 'hidden';
          testSpan.style.whiteSpace = 'pre';
          testSpan.textContent = 'MMMMMMMMMM';
          
          document.body.appendChild(testSpan);
          const spanRect = testSpan.getBoundingClientRect();
          document.body.removeChild(testSpan);
          
          const characterWidth = spanRect.width / 10;
          const characterHeight = fontSize;
          
          return {
              charWidth_px: characterWidth > 0 ? characterWidth : 1,
              charHeight_px: characterHeight > 0 ? characterHeight : 1
          };
      }

      /** Initializes the desktop system. */
      function initializeSystem() {
          // Get font size and measure character dimensions
          const style = window.getComputedStyle(charactersGridElement);
          const fontSize = parseFloat(style.fontSize);
          ({charWidth_px, charHeight_px} = measureMonospaceFontDimensions(fontSize));
          
          updateGridDimensions();
          createStatusTWidget();

          // Create main menu
          const menuItems = [
              {
                  label: "Create",
                  subMenu: [
                      { label: "Editor", callback: createEditor },
                      { label: "Clock", callback: createClock },
                      { label: "Text View", callback: createTextWidget }
                  ]
              },
              { label: "Random widget", callback: createRandomTWidget }
          ];
          const menuWidth = 20;
          const menuHeight = menuItems.length + 2;
          menuWidget = new TMenuWidget(2, 2, menuWidth, menuHeight, "Main Menu", menuItems, true);
          tWidgets.push(menuWidget);

          // Create initial editor and set up event listeners
          createEditor();
          drawTWidgets();

          charactersGridElement.addEventListener('mousedown', handleMouseDown);
          window.addEventListener('mousemove', handleMouseMove);
          window.addEventListener('mouseup', handleMouseUp);
          charactersGridElement.addEventListener('wheel', handleWheel, {passive: false});
          window.addEventListener('keydown', handleKeyDown);
          window.addEventListener('resize', handleResize);

          showStatusMessage("System Initialized. Click menu or widgets.");
      }

      /** Updates global grid dimensions and clamps/resizes widgets if necessary. */
      function updateGridDimensions() {
          const gridBounds = charactersGridElement.getBoundingClientRect();
          const newGridWidth = charWidth_px > 0 ? Math.floor(gridBounds.width / charWidth_px) : 0;
          const newGridHeight = charHeight_px > 0 ? Math.floor(gridBounds.height / charHeight_px) : 0;

          if (newGridWidth !== GRID_WIDTH_chars || newGridHeight !== GRID_HEIGHT_chars) {
              GRID_WIDTH_chars = newGridWidth;
              GRID_HEIGHT_chars = newGridHeight;

              // Update status widget position and dimensions
              if (statusWidget) {
                  statusWidget.x = 0;
                  statusWidget.y = GRID_HEIGHT_chars - STATUS_WINDOW_HEIGHT_chars;
                  statusWidget.w = GRID_WIDTH_chars;
                  statusWidget.h = STATUS_WINDOW_HEIGHT_chars;
                  statusWidget.updateDimensions(statusWidget.w, statusWidget.h);
              }

              // Update all other widgets
              tWidgets.forEach(widget => {
                  if (widget === statusWidget) return;

                  // Clamp position
                  widget.x = clamp(widget.x, 0, GRID_WIDTH_chars - widget.w);
                  widget.y = clamp(widget.y, 0, GRID_HEIGHT_chars - widget.h - STATUS_WINDOW_HEIGHT_chars);

                  // Adjust dimensions if needed
                  const clampedWidgetWidth = Math.min(widget.w, GRID_WIDTH_chars - widget.x);
                  const clampedWidgetHeight = Math.min(widget.h, GRID_HEIGHT_chars - widget.y - STATUS_WINDOW_HEIGHT_chars);
                  
                  if (widget.w !== clampedWidgetWidth || widget.h !== clampedWidgetHeight) {
                      widget.updateDimensions(clampedWidgetWidth, clampedWidgetHeight);
                  }
              });
              return true;
          }
          return false;
      }

      /** Handles browser window resize events. */
      function handleResize() {
          const dimensionsChanged = updateGridDimensions();
          if (dimensionsChanged) drawTWidgets();
      }

      // --- Initialize ---
      requestAnimationFrame(() => {
          initializeSystem();
      });

    </script>
</body>
